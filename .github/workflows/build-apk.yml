name: Build and Release Anar-Unik Snake

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snake-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/snake-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PappVersionCode=$((100 + $GITHUB_RUN_NUMBER)) \
            -PappVersionName=2.1.$GITHUB_RUN_NUMBER
          cp app/build/outputs/apk/release/app-release.apk Anar-Unik-Snake.apk

      - name: Build debug APK (temporary signing fallback)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          gradle --no-daemon assembleDebug \
            -PappVersionCode=$((100 + $GITHUB_RUN_NUMBER)) \
            -PappVersionName=2.1.$GITHUB_RUN_NUMBER
          cp app/build/outputs/apk/debug/app-debug.apk Anar-Unik-Snake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anar-Unik-Snake-apk
          path: Anar-Unik-Snake.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Anar-Unik Snake 2.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic Android APK release from commit ${{ github.sha }}.

            Download **Anar-Unik-Snake.apk** and install it on your Android device.
          files: Anar-Unik-Snake.apk
          make_latest: true
